  - '@tanstack/ai-gemini@0.32.1'
  - '@tanstack/ai-openai@0.23.2'
  - '@tanstack/ai@0.59.0'
  - '@tanstack/openai-base@0.10.16'

overrides:
  '@hono/node-server@<2.1.3': 2.1.9
  'fast-uri@>=3 <3.1.9': 3.1.9
  'glob@>=9 <14.0.2': 14.0.6
  'hono@<4.13.16': 4.13.19
  'ip-address@<=10.7.3': 10.7.6
  'katex@>=0.11 <0.18.2': 0.18.2
  'minimatch@>=7 <11.0.1': 11.0.9
  'qs@>=6.7 <6.16.1': 6.17.1
  'uuid@<11.1.1': 11.1.1
